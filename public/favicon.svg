<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#58a6ff"/>
      <stop offset="55%"  stop-color="#6ee7ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="32" height="32" rx="7" fill="#04060c"/>

  <!-- subtle grid lines (2 each axis) -->
  <line x1="10.5" y1="1" x2="10.5" y2="31" stroke="#8caae6" stroke-width="0.3" stroke-opacity="0.08"/>
  <line x1="21.5" y1="1" x2="21.5" y2="31" stroke="#8caae6" stroke-width="0.3" stroke-opacity="0.08"/>
  <line x1="1" y1="10.5" x2="31" y2="10.5" stroke="#8caae6" stroke-width="0.3" stroke-opacity="0.08"/>
  <line x1="1" y1="21.5" x2="31" y2="21.5" stroke="#8caae6" stroke-width="0.3" stroke-opacity="0.08"/>

  <!-- border -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.4"
        fill="none" stroke="url(#g)" stroke-width="0.75" stroke-opacity="0.45"/>

  <!-- RK monogram -->
  <text
    x="16" y="20.5"
    text-anchor="middle"
    font-family="ui-monospace, monospace"
    font-weight="700"
    font-size="13.5"
    letter-spacing="1"
    fill="url(#g)"
    filter="url(#glow)"
  >RK</text>

  <!-- accent dot -->
  <circle cx="16" cy="26" r="1.4" fill="#58a6ff" opacity="0.8" filter="url(#glow)"/>
</svg>
